<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="AI-SDLC maturity model, six levels with defining characteristics"><rect width="1400" height="600" fill="#F8F2E7" rx="14"/><defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C97E12"/></marker></defs><text x="40" y="50" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#2E1A47">Nimble Gravity AI-SDLC Maturity Model</text><text x="40" y="72" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6E6280">Six levels, one concrete gate per transition</text><rect x="40" y="150" width="200" height="320" rx="10" fill="#EFEAF9" stroke="#2E1A47" stroke-width="1.5"/><text x="58" y="182" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C97E12">LEVEL 0</text><text x="58" y="208" font-family="Arial,sans-serif" font-size="16.5" font-weight="700" fill="#2E1A47">No AI Use</text><line x1="58" y1="226" x2="222" y2="226" stroke="#C97E12" stroke-width="1.2"/><circle cx="62" cy="244" r="2.2" fill="#C97E12"/><text x="72" y="248" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">No sanctioned AI tooling</text><circle cx="62" cy="267" r="2.2" fill="#C97E12"/><text x="72" y="271" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">No acceptable-use policy</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">or data rules</text><circle cx="62" cy="305" r="2.2" fill="#C97E12"/><text x="72" y="309" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Shadow AI risk invisible</text><circle cx="62" cy="328" r="2.2" fill="#C97E12"/><text x="72" y="332" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">No baseline for later</text><text x="72" y="347" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">comparison</text><line x1="242" y1="310" x2="264" y2="310" stroke="#C97E12" stroke-width="2.5" marker-end="url(#a2)"/><line x1="255" y1="322" x2="255" y2="480" stroke="#CBBFA9" stroke-width="1.2"/><text x="255" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C97E12">GATE 0→1</text><text x="255" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">First sanctioned license +</text><text x="255" y="539" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">AUP</text><rect x="270" y="150" width="200" height="320" rx="10" fill="#EFEAF9" stroke="#2E1A47" stroke-width="1.5"/><text x="288" y="182" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C97E12">LEVEL 1</text><text x="288" y="208" font-family="Arial,sans-serif" font-size="16.5" font-weight="700" fill="#2E1A47">Ad Hoc</text><line x1="288" y1="226" x2="452" y2="226" stroke="#C97E12" stroke-width="1.2"/><circle cx="292" cy="244" r="2.2" fill="#C97E12"/><text x="302" y="248" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Individual, improvised</text><text x="302" y="263" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">use</text><circle cx="292" cy="282" r="2.2" fill="#C97E12"/><text x="302" y="286" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Champions self-identify</text><circle cx="292" cy="305" r="2.2" fill="#C97E12"/><text x="302" y="309" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">AUP and approved-tool</text><text x="302" y="324" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">list exist</text><circle cx="292" cy="343" r="2.2" fill="#C97E12"/><text x="302" y="347" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Seat counts are the only</text><text x="302" y="362" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">metric</text><circle cx="292" cy="381" r="2.2" fill="#C97E12"/><text x="302" y="385" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Value leaves with the</text><text x="302" y="400" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">person</text><line x1="472" y1="310" x2="494" y2="310" stroke="#C97E12" stroke-width="2.5" marker-end="url(#a2)"/><line x1="485" y1="298" x2="485" y2="126" stroke="#CBBFA9" stroke-width="1.2"/><text x="485" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C97E12">GATE 1→2</text><text x="485" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">Config in version control,</text><text x="485" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">reproduced</text><rect x="500" y="150" width="200" height="320" rx="10" fill="#EFEAF9" stroke="#2E1A47" stroke-width="1.5"/><text x="518" y="182" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C97E12">LEVEL 2</text><text x="518" y="208" font-family="Arial,sans-serif" font-size="16.5" font-weight="700" fill="#2E1A47">Defined</text><line x1="518" y1="226" x2="682" y2="226" stroke="#C97E12" stroke-width="1.2"/><circle cx="522" cy="244" r="2.2" fill="#C97E12"/><text x="532" y="248" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Named, documented</text><text x="532" y="263" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">workflows</text><circle cx="522" cy="282" r="2.2" fill="#C97E12"/><text x="532" y="286" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Config versioned in every</text><text x="532" y="301" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">repo</text><circle cx="522" cy="320" r="2.2" fill="#C97E12"/><text x="532" y="324" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Golden-path templates</text><circle cx="522" cy="343" r="2.2" fill="#C97E12"/><text x="532" y="347" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Provenance labeled in PRs</text><circle cx="522" cy="366" r="2.2" fill="#C97E12"/><text x="532" y="370" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Adoption tracked per</text><text x="532" y="385" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">workflow</text><line x1="702" y1="310" x2="724" y2="310" stroke="#C97E12" stroke-width="2.5" marker-end="url(#a2)"/><line x1="715" y1="322" x2="715" y2="480" stroke="#CBBFA9" stroke-width="1.2"/><text x="715" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C97E12">GATE 2→3</text><text x="715" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">First AI-driven ticket,</text><text x="715" y="539" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">checkpoint approvals</text><rect x="730" y="150" width="200" height="320" rx="10" fill="#EFEAF9" stroke="#2E1A47" stroke-width="1.5"/><text x="748" y="182" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C97E12">LEVEL 3</text><text x="748" y="208" font-family="Arial,sans-serif" font-size="16.5" font-weight="700" fill="#2E1A47">Managed Autonomy</text><line x1="748" y1="226" x2="912" y2="226" stroke="#C97E12" stroke-width="1.2"/><circle cx="752" cy="244" r="2.2" fill="#C97E12"/><text x="762" y="248" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Agents execute inside</text><text x="762" y="263" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">boundaries</text><circle cx="752" cy="282" r="2.2" fill="#C97E12"/><text x="762" y="286" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Checkpoints replace line</text><text x="762" y="301" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">review</text><circle cx="752" cy="320" r="2.2" fill="#C97E12"/><text x="762" y="324" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Verification harness</text><text x="762" y="339" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">gates merges</text><circle cx="752" cy="358" r="2.2" fill="#C97E12"/><text x="762" y="362" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Machine-readable</text><text x="762" y="377" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">definition of done</text><circle cx="752" cy="396" r="2.2" fill="#C97E12"/><text x="762" y="400" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Audit trail and tested</text><text x="762" y="415" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">rollback</text><line x1="932" y1="310" x2="954" y2="310" stroke="#C97E12" stroke-width="2.5" marker-end="url(#a2)"/><line x1="945" y1="298" x2="945" y2="126" stroke="#CBBFA9" stroke-width="1.2"/><text x="945" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C97E12">GATE 3→4</text><text x="945" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">Telemetry default-on,</text><text x="945" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">first retirement</text><rect x="960" y="150" width="200" height="320" rx="10" fill="#EFEAF9" stroke="#2E1A47" stroke-width="1.5"/><text x="978" y="182" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C97E12">LEVEL 4</text><text x="978" y="208" font-family="Arial,sans-serif" font-size="16.5" font-weight="700" fill="#2E1A47">Quantitatively</text><text x="978" y="228" font-family="Arial,sans-serif" font-size="16.5" font-weight="700" fill="#2E1A47">Managed</text><line x1="978" y1="246" x2="1142" y2="246" stroke="#C97E12" stroke-width="1.2"/><circle cx="982" cy="264" r="2.2" fill="#C97E12"/><text x="992" y="268" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Telemetry on by default</text><circle cx="982" cy="287" r="2.2" fill="#C97E12"/><text x="992" y="291" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Baseline before any</text><text x="992" y="306" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">rollout</text><circle cx="982" cy="325" r="2.2" fill="#C97E12"/><text x="992" y="329" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Net ROI per named</text><text x="992" y="344" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">workflow</text><circle cx="982" cy="363" r="2.2" fill="#C97E12"/><text x="992" y="367" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Promote or retire on</text><text x="992" y="382" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">thresholds</text><circle cx="982" cy="401" r="2.2" fill="#C97E12"/><text x="992" y="405" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">Spend limits, pinned</text><text x="992" y="420" font-family="Arial,sans-serif" font-size="11.8" fill="#443659">model versions</text><line x1="1162" y1="310" x2="1184" y2="310" stroke="#C97E12" stroke-width="2.5" marker-end="url(#a2)"/><line x1="1175" y1="322" x2="1175" y2="480" stroke="#CBBFA9" stroke-width="1.2"/><text x="1175" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C97E12">GATE 4→5</text><text x="1175" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">Agent-first SDLC in the</text><text x="1175" y="539" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-style="italic" fill="#6E6280">SoW</text><rect x="1190" y="150" width="200" height="320" rx="10" fill="#2E1A47" stroke="#2E1A47" stroke-width="0"/><text x="1208" y="182" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C97E12">LEVEL 5</text><text x="1208" y="208" font-family="Arial,sans-serif" font-size="16.5" font-weight="700" fill="#FFFFFF">Optimizing</text><line x1="1208" y1="226" x2="1372" y2="226" stroke="#C97E12" stroke-width="1.2"/><circle cx="1212" cy="244" r="2.2" fill="#C97E12"/><text x="1222" y="248" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">Specs are the source of</text><text x="1222" y="263" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">truth</text><circle cx="1212" cy="282" r="2.2" fill="#C97E12"/><text x="1222" y="286" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">Backlog agent-ready by</text><text x="1222" y="301" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">default</text><circle cx="1212" cy="320" r="2.2" fill="#C97E12"/><text x="1222" y="324" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">Review is</text><text x="1222" y="339" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">exception-driven</text><circle cx="1212" cy="358" r="2.2" fill="#C97E12"/><text x="1222" y="362" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">Policy enforced as code</text><circle cx="1212" cy="381" r="2.2" fill="#C97E12"/><text x="1222" y="385" font-family="Arial,sans-serif" font-size="11.8" fill="#EFEAF9">Outcome-based economics</text></svg>